[project]
name = "4a-prompt-manager"
version = "1.1.1"
description = "Folder-backed prompt library and multi-track scheduler for ComfyUI. Browse/edit wildcards and JSON cards (with LoRAs); per-run auto-embed of wildcard LoRAs and negatives into the Loader (each queue job is independent); reuse image metadata; save with A1111-style parameters."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Tsukino4A" },
]
dependencies = [
    "piexif>=1.1.3",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/tsukino4a/ComfyUI-4A-Prompt-Manager"
Documentation = "https://github.com/tsukino4a/ComfyUI-4A-Prompt-Manager#readme"
"Bug Tracker" = "https://github.com/tsukino4a/ComfyUI-4A-Prompt-Manager/issues"

[tool.comfy]
PublisherId = "tsukino4a"
DisplayName = "4A Prompt Manager"
